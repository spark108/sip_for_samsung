plugins { id 'com.android.application' }

android {
    namespace 'ru.spark108.sipphoneservice'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.spark108.sipphoneservice'
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.linphone.minimal:linphone-sdk-android:5.5.39'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.media:media:1.7.1'
}
